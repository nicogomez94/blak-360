<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot WhatsApp</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/auth.js"></script>
    <link rel="stylesheet" href="/admin-dashboard.css">
</head>
<body>
    <script>
        // Verificar autenticación al cargar la página
        requireAuth();
    </script>
    
    <div class="header">
        <h1>⚡ CHATBOT DASHBOARD</h1>
        <!-- <p>Sistema de Gestión de Conversaciones WhatsApp</p> -->
    </div>

    <div class="container">
        <div class="stats" id="stats">
            <!-- Se carga dinámicamente -->
        </div>

        <section class="chatbot-settings" aria-labelledby="chatbot-settings-title">
            <div class="chatbot-settings-header">
                <div>
                    <h2 id="chatbot-settings-title">Configuración del chatbot</h2>
                    <p>Control global. Cuando está apagado, nunca responde automáticamente.</p>
                </div>
                <span class="chatbot-status" id="chatbotStatus">Cargando…</span>
            </div>
            <div class="chatbot-settings-fields">
                <label class="chatbot-toggle" for="chatbotEnabled">
                    <input id="chatbotEnabled" type="checkbox">
                    <span class="chatbot-toggle-track" aria-hidden="true"></span>
                    <span>Activar respuestas automáticas</span>
                </label>
                <label>
                    Empieza a las
                    <input id="chatbotActiveFrom" type="number" min="0" max="23" step="1" inputmode="numeric" aria-label="Hora de inicio">
                </label>
                <label>
                    Termina a las
                    <input id="chatbotActiveUntil" type="number" min="0" max="23" step="1" inputmode="numeric" aria-label="Hora de finalización">
                </label>
                <button class="save-settings-btn" id="saveChatbotSettings" type="button" onclick="saveChatbotSettings()">Guardar configuración</button>
            </div>
            <p class="chatbot-settings-help">Horario de Argentina. Ejemplo: de 18 a 9 cubre la noche; si ambas horas son iguales, queda activo las 24 horas.</p>
        </section>

        <div class="conversations">
            <div class="conversations-header">
                <h2>Conversaciones Activas</h2>
                <button class="refresh-btn" onclick="loadData()">🔄 Actualizar</button>
            </div>
            <div id="conversations-list">
                <!-- Se carga dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal para ver conversación -->
    <div id="conversationModal" class="modal">
        <div class="modal-content">
            <!-- Header del Chat -->
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-avatar" id="chatAvatar">👤</div>
                    <div>
                        <div class="chat-name" id="chatName">Conversación</div>
                        <div class="chat-status" id="chatStatus">En línea</div>
                    </div>
                </div>
                <span class="close" onclick="closeModal()" style="font-size: 1.5rem; cursor: pointer;">&times;</span>
            </div>
            
            <!-- Área de Mensajes -->
            <div class="messages-container" id="modalMessages">
                <!-- Los mensajes se cargan aquí -->
            </div>
            
            <!-- Área de Envío -->
            <div class="send-message">
                <textarea 
                    class="message-input" 
                    id="messageInput" 
                    placeholder="Escribe un mensaje..."
                    rows="1"
                    onkeydown="handleKeyPress(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script src="/admin-dashboard.js"></script>
    <script>
        // Agregar botón de logout cuando cargue la página
        window.addEventListener('DOMContentLoaded', function() {
            addLogoutButton('header');
        });
    </script>
</body>
</html>
