services:
  - type: web
    name: blak-meta-chatbot
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:bootstrap
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHATBOT_ENABLED
        value: "false"
      - key: CHATBOT_ACTIVE_FROM
        value: "18"
      - key: CHATBOT_ACTIVE_UNTIL
        value: "9"
      - key: CHATBOT_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
